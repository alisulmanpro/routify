# CI (P0.9): backend pytest + ruff, rider-app tsc + lint + unit tests, admin-web tsc + lint.
# The backend tests run against a throwaway Postgres service container, never Neon (ISSUE-05): the suite resets its database.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-py
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # conftest.py reads these; there is no .env in CI. Redis is optional (in-process fallback).
      DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/routify_ci_unused
      TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/routify_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend-py/.python-version
          cache: pip
          cache-dependency-path: backend-py/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: prisma generate
      - run: ruff check .
      - run: pytest -q

  rider-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rider-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rider-app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run lint
