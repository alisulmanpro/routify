# Local PostgreSQL for development and tests:  docker compose up -d
# Port 5433 on the host (5432 is often taken by another local Postgres).
services:
  postgres:
    image: postgres:16-alpine
    container_name: routify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: routify
      POSTGRES_PASSWORD: routify_dev_pw
      POSTGRES_DB: routify
    ports:
      - "5433:5432"
    volumes:
      - routify_pgdata:/var/lib/postgresql/data

volumes:
  routify_pgdata:
    external: true
