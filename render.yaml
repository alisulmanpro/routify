# Render Blueprint: the Routify API (backend-py) for client testing.
# Render > New > Blueprint > pick this repo. Values marked `sync: false` are asked for once in the dashboard;
# `generateValue` secrets are created by Render. The database is Neon (DATABASE_URL), not a Render database.
services:
  - type: web
    name: routify-api
    runtime: python
    plan: free                     # sleeps after 15 min idle; uploaded photos/PDFs are lost on restart (no disk on free)
    region: ohio                   # same area as the Neon database (aws us-east-2)
    rootDir: backend-py
    # Migrations run during the build (pre-deploy commands need a paid plan). They only ever add to the schema.
    # They use DIRECT_URL (Neon's direct host); until it is set in the dashboard they fall back to DATABASE_URL.
    buildCommand: pip install -r requirements.txt && prisma generate && DIRECT_URL="${DIRECT_URL:-$DATABASE_URL}" prisma migrate deploy
    # Two processes: the worker (route optimisation jobs, python -m app.worker) and the API. Heavy planning never runs
    # in the API process. If the worker dies, the loop starts it again after 5 s. On a paid plan, move the worker to its
    # own Render "worker" service (Render then restarts it) and set this back to `python -m app` (ISSUE-32).
    startCommand: sh -c "(while true; do python -m app.worker; echo 'worker exited; restarting in 5 s' >&2; sleep 5; done) & exec python -m app"
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Render keeps only the project folder between build and runtime, so Prisma's engines must be downloaded there.
      - key: PRISMA_BINARY_CACHE_DIR
        value: /opt/render/project/src/backend-py/.prisma-cache/binaries
      - key: PRISMA_NODEENV_CACHE_DIR
        value: /opt/render/project/src/backend-py/.prisma-cache/nodeenv
      # Render's proxy adds the caller's IP to X-Forwarded-For: trust one hop so rate limits apply per client.
      - key: TRUST_PROXY
        value: "1"

      - key: DATABASE_URL           # Neon pooled connection string: "-pooler" host, ...?sslmode=require&channel_binding=require&pgbouncer=true
        sync: false
      - key: DIRECT_URL             # Neon direct connection string (no "-pooler"), used only by prisma migrate deploy
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FILE_SIGNING_SECRET
        generateValue: true
      # Allowed browser origins (the admin console). The mobile app does not need CORS.
      - key: CORS_ORIGINS
        value: http://localhost:5173

      # Files in Cloudflare R2 (S3-compatible). Copy existing files first: python -m scripts.migrate_files_to_s3.
      - key: S3_ENDPOINT              # https://<account-id>.r2.cloudflarestorage.com
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto

      # Redis: rate limits and caches shared by all API processes/instances (Render Key Value or Upstash).
      - key: REDIS_URL
        sync: false

      # Error reporting (Sentry) for the API and the worker. Empty = off.
      - key: SENTRY_DSN
        sync: false

      # Log shipping (e.g. Better Stack HTTP source) and alerts (Slack-compatible webhook). Empty = off.
      - key: LOG_SHIP_URL
        sync: false
      - key: LOG_SHIP_TOKEN
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false

      # Rider app versions (GET /config): below MIN the app must update; below LATEST it suggests updating.
      - key: MIN_APP_VERSION
        value: "1.0.0"
      - key: LATEST_APP_VERSION
        value: "1.0.0"

      - key: GEOCODING_PROVIDER
        value: google
      - key: GOOGLE_MAPS_API_KEY
        sync: false

      # Client testing: the mock store activates real subscriptions without payment (the app shows "Test store").
      # Remove mock and ALLOW_MOCK_STORE before launch so only RevenueCat sells plans.
      - key: PAYMENT_STORES
        value: revenuecat,mock
      - key: ALLOW_MOCK_STORE
        value: "true"
      - key: REVENUECAT_SECRET_API_KEY  # sk_... (V1) from RevenueCat > Project settings > API keys
        sync: false
      - key: REVENUECAT_WEBHOOK_AUTH    # copy this value into RevenueCat > Integrations > Webhooks > Authorization
        generateValue: true
      - key: REVENUECAT_ENTITLEMENT
        value: routify_pro

      # Password reset emails through Brevo SMTP. EMAIL_FROM must be a verified sender in Brevo.
      - key: EMAIL_PROVIDER
        value: smtp
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: Routify
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT                # Render's free plan blocks outbound 25/465/587; Brevo also listens on 2525
        value: "2525"
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_USERNAME            # Brevo > SMTP & API > SMTP > Login
        sync: false
      - key: SMTP_PASSWORD            # Brevo SMTP key (xsmtpsib-...)
        sync: false
